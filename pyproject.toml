[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agri-anomaly"
version = "0.1.0"
description = "AI-based detection of anomalous and falsified IoT sensor data for smart agriculture"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
